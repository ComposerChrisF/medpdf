[package]
name = "medpdf"
version = "0.14.0"
edition = "2024"
description = "Medium-level PDF API over lopdf"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ComposerChrisF/medpdf"
keywords = ["pdf", "lopdf", "merge", "watermark", "overlay"]
categories = ["multimedia::encoding"]
# Working-tree artifacts, not part of the published crate.  bugs/ and plans/ are
# delete-on-resolve directories (~/.claude/rules/bug-reports.md, plan-files.md);
# without this they ship in the tarball.  Defensive: none exist in this member
# dir today, but rule 7 puts per-sub-project bugs//plans/ exactly here.
exclude = ["CLAUDE.md", ".claude/", ".github/", "bugs/", "plans/"]

[dependencies]
lopdf = "0.42.0"
nom = "7.1"
font-kit = "0.14.3"
ttf-parser = "0.25.1"
allsorts = "0.16"
log = "0.4"
rand = "0.10"
itoa = "1"

[dev-dependencies]
tempfile = "3"
pdf-test-visual = { path = "../pdf-test-visual" }
